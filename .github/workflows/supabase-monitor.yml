name: Supabase Monitor

on:
  schedule:
    # UTC 時間，每天執行 3 次
    # 台灣時間約為 08:17、16:17、00:17
    - cron: "17 0,8,16 * * *"

  workflow_dispatch:

jobs:
  check-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
            - name: Query Supabase health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          endpoint="${SUPABASE_URL}/rest/v1/health_check?id=eq.1&select=id,service_name"

          echo "Checking Supabase project..."

          http_code=$(
            curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              --max-time 20 \
              "${endpoint}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}"
          )

          echo "HTTP status: ${http_code}"
          echo "Response:"
          cat response.json
          echo

          if [ "${http_code}" != "200" ]; then
            echo "Supabase returned HTTP ${http_code}."
            exit 1
          fi

          if ! grep -q '"service_name":"database"' response.json; then
            echo "Unexpected health-check response."
            exit 1
          fi

          echo "Supabase database is healthy."
